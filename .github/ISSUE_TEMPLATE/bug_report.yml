name: Bug report
description: Report a reproducible Carbon Club defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include private keys, invitations, IP addresses, session titles, or signed message corpora. Use private vulnerability reporting for security issues.
  - type: input
    id: dsh
    attributes:
      label: DSH version
      placeholder: 0.1.1-rc.2
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: Carbon Club version
      placeholder: 0.5.0-beta.1
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Give the smallest safe sequence that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, browser, network shape, and relay count.
